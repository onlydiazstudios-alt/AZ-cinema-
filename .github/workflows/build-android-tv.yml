name: Build AZ CINEMA Android TV APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: az-cinema-android-tv-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify persistent signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required signing secret $name is missing. Refusing to publish an unsigned APK."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/az-cinema-release.jks
          chmod 600 app/az-cinema-release.jks
          keytool -list -keystore app/az-cinema-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Persistent signing key and alias verified."

      - name: Build signed Android TV APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/app/az-cinema-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AZ-CINEMA-Android-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish signed APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: az-cinema-latest
          name: AZ CINEMA latest build
          body: |
            Automatically versioned, persistently signed Android TV APK.
            GitHub Actions build number: ${{ github.run_number }}.
            Use the in-app GitHub Update screen to install this release.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
